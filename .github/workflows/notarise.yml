# Notarise a release's dmg with the App Store Connect key (secrets APPLE_API_KEY, its .p8 text; APPLE_API_KEY_ID;
# APPLE_API_ISSUER), staple it and publish the release. The dmg is built and signed with the Developer ID on the
# release Mac (packaging/release-mac.sh, which uploads it to a draft release and starts this); the game can't be
# built here: its third-party art stays out of git. Notarising the dmg covers the app inside (Apple's notary
# checks every nested binary). Same steps as Off Grid AI Desktop's release.yml.
name: Notarise
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The draft release's tag"
        required: true
permissions:
  contents: write
jobs:
  notarise:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: The dmg from the draft release
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.dmg' -D dmg
      - name: Notarise, staple, check
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          DMG=$(ls dmg/*.dmg)
          codesign --verify --verbose "$DMG"
          for i in 1 2 3; do
            xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" --wait --timeout 60m && break
            [ "$i" = 3 ] && exit 1
            echo "notarisation attempt $i failed; retrying in 60s"; sleep 60
          done
          # stapler reaches Apple's ticket service, whose connections from runners drop now and then.
          for i in 1 2 3 4 5 6; do
            xcrun stapler staple -v "$DMG" && break
            [ "$i" = 6 ] && exit 1
            sleep 30
          done
          xcrun stapler validate "$DMG"
          spctl -a -vv -t open --context context:primary-signature "$DMG"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
      - name: Publish
        run: |
          gh release upload "$TAG" "$DMG" --clobber -R "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest -R "$GITHUB_REPOSITORY"
