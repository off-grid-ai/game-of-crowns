name: Release (Mac)

# Builds, signs and notarises Game of Crowns for Apple Silicon and publishes the dmg as a
# GitHub Release. Modelled on Off Grid AI Desktop's release (OGAD .github/workflows/release.yml).
#
# Runs on the self-hosted Mac runner labelled goc-release, because the third-party art (3.6 GB of
# Sketchfab, Mixamo, Quaternius and other kits) stays out of git by licence (see .gitignore):
# the runner copies it, with Godot's import cache, from the working copy on that Mac. The shipped
# app carries the art inside its .pck, which those licences allow.
#
# Manual only: Actions -> Release (Mac) -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-mac
  cancel-in-progress: false

jobs:
  build-mac:
    runs-on: [self-hosted, macOS, ARM64, goc-release]
    timeout-minutes: 180
    env:
      # The working copy on the runner's Mac that holds the art and the import cache.
      GOC_ART_FROM: ${{ vars.GOC_ART_FROM || '/Users/user/wednesday/civilization' }}
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Bring in the art and the import cache
        run: |
          set -euo pipefail
          test -d "$GOC_ART_FROM/realm/assets" || { echo "::error::no art at $GOC_ART_FROM/realm/assets"; exit 1; }
          # Only files git doesn't carry: the checkout's own files win.
          rsync -a --ignore-existing "$GOC_ART_FROM/realm/assets/" realm/assets/
          if [ -d "$GOC_ART_FROM/realm/.godot" ]; then rsync -a --delete "$GOC_ART_FROM/realm/.godot/" realm/.godot/; fi
          du -sh realm/assets

      - name: Re-import changed art
        run: cd realm && arch -arm64 godot --headless --path . --import

      - name: Build, sign and notarise
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          # notarytool needs the key as a file; write it from the secret, as OGAD does.
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          # Signs with the Developer ID Application identity in the runner Mac's keychain.
          packaging/build-mac.sh
          rm -f "$APPLE_API_KEY"

      - name: Check the dmg opens on any Mac
        run: |
          set -euo pipefail
          DMG=$(ls build/Game-of-Crowns-*-arm64.dmg)
          spctl -a -vv -t open --context context:primary-signature "$DMG"
          xcrun stapler validate "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^application\/short_version="\(.*\)"/\1/p' realm/export_presets.cfg)
          TAG="v$VERSION-${{ github.run_number }}"
          FLAG=""; [ "$PRERELEASE" = "true" ] && FLAG="--prerelease"
          gh release create "$TAG" "$DMG" $FLAG \
            --target "$GITHUB_SHA" \
            --title "Game of Crowns $VERSION (build ${{ github.run_number }})" \
            --notes "Free, nothing locked. For Macs with Apple Silicon. Open the dmg and drag Game of Crowns to Applications. On first run it downloads its 1.8 GB language model; the realm plays by its rules until the model is ready."
