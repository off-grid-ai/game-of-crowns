name: Release (Mac)

# Builds, signs and notarises Game of Crowns for Apple Silicon on GitHub's macOS runner and
# publishes the dmg as a GitHub Release. Modelled on Off Grid AI Desktop's release
# (OGAD .github/workflows/release.yml), with the same secrets.
#
# The third-party art (Sketchfab, Mixamo, Quaternius and other kits) stays out of git: its
# licences allow shipping it inside the game, not handing out the raw files. It lives as parts of
# the repo's private DRAFT release "art-store" (uploaded by packaging/upload-art.py), which only
# the team and this workflow's token can read. The shipped app carries the art inside its .pck.
#
# Manual only: Actions -> Release (Mac) -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: true

permissions:
  contents: write # publish the release, and read the art-store draft

concurrency:
  group: release-mac
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  LLAMA_BUILD: b12019 # the llama.cpp build Off Grid AI Desktop ships (reads Omni's lfm3)

jobs:
  build-mac:
    runs-on: macos-15 # Apple Silicon
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Make room on the runner
        run: |
          # The art, Godot's import cache and the export need ~15 GB; the runner image's spare
          # Xcode versions and Android SDK take far more than that.
          SELECTED=$(xcode-select -p | sed 's|/Contents/Developer||')
          for x in /Applications/Xcode_*.app; do [ "$x" = "$SELECTED" ] || sudo rm -rf "$x"; done
          rm -rf "$HOME/Library/Android" || true
          df -h /

      - name: Tools (Freeciv, dylibbundler, zstd)
        run: brew install freeciv dylibbundler zstd

      - name: Godot ${{ env.GODOT_VERSION }} and its export templates
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip -d godot && rm godot.zip
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && unzip -q templates.tpz -d tpl && mv tpl/templates/* "$dest/" && rm -rf templates.tpz tpl
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec "%s/godot/Godot.app/Contents/MacOS/Godot" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/bin/godot"
          chmod +x "$RUNNER_TEMP/bin/godot"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: llama-server (llama.cpp ${{ env.LLAMA_BUILD }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "$LLAMA_BUILD" -R ggml-org/llama.cpp -p "llama-${LLAMA_BUILD}-bin-macos-arm64.tar.gz"
          mkdir llama && tar -xzf "llama-${LLAMA_BUILD}-bin-macos-arm64.tar.gz" -C llama && rm -f llama-*.tar.gz
          dir=$(dirname "$(find "$RUNNER_TEMP/llama" -name llama-server -type f | head -1)")
          test -x "$dir/llama-server"
          echo "OGAD_LLAMA=$dir" >> "$GITHUB_ENV"

      - name: The art, from the private art-store draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/art"
          gh release download art-store -R "$GITHUB_REPOSITORY" -p 'art.tar.zst.part-*' -D "$RUNNER_TEMP/art"
          want=$(cut -d' ' -f1 packaging/art.sha256)
          got=$(cat "$RUNNER_TEMP"/art/art.tar.zst.part-* | shasum -a 256 | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "::error::art checksum $got, expected $want (re-run packaging/upload-art.py and commit packaging/art.sha256)"; exit 1; }
          cat "$RUNNER_TEMP"/art/art.tar.zst.part-* | zstd -d -q | tar -xf -
          rm -rf "$RUNNER_TEMP/art"
          du -sh realm/assets

      - name: Godot's import cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: realm/.godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('packaging/art.sha256', 'realm/project.godot', 'realm/**/*.import') }}
          restore-keys: godot-import-${{ env.GODOT_VERSION }}-

      - name: Import the art
        run: cd realm && godot --headless --path . --import

      - name: Build, sign and notarise
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          test -n "$CSC_LINK" || { echo "::error::CSC_LINK is not set (the Developer ID .p12, as in OGAD)"; exit 1; }
          # notarytool needs the key as a file; write it from the secret, as OGAD does.
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          packaging/build-mac.sh
          rm -f "$APPLE_API_KEY"

      - name: Check the dmg opens on any Mac
        run: |
          set -euo pipefail
          DMG=$(ls build/Game-of-Crowns-*-arm64.dmg)
          spctl -a -vv -t open --context context:primary-signature "$DMG"
          xcrun stapler validate "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^application\/short_version="\(.*\)"/\1/p' realm/export_presets.cfg)
          TAG="v$VERSION-${{ github.run_number }}"
          FLAG=""; [ "$PRERELEASE" = "true" ] && FLAG="--prerelease"
          gh release create "$TAG" "$DMG" $FLAG \
            --target "$GITHUB_SHA" \
            --title "Game of Crowns $VERSION (build ${{ github.run_number }})" \
            --notes "Free, nothing locked. For Macs with Apple Silicon. Open the dmg and drag Game of Crowns to Applications. On first run it downloads its 1.8 GB language model; the realm plays by its rules until the model is ready."
