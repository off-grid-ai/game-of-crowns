<title>Game of Crowns Roadmap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Geist:wght@400;500&display=swap">
<style>
/* Layout: one short column, a title and a plain tick list, an add line at the foot. */
:root {
  --bg: #f4efe6; --line: #e4dac8; --fg: #2a241c; --muted: #85786a; --accent: #a87a1f;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Geist", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #17130f; --line: #33291f; --fg: #efe7da; --muted: #9d907d; --accent: #d9a84a; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #17130f; --line: #33291f; --fg: #efe7da; --muted: #9d907d; --accent: #d9a84a; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 48px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
h1 { font-family: var(--display); font-weight: 600; font-size: 40px; line-height: 1; margin: 0; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: grid; grid-template-columns: 20px 1fr auto; gap: 12px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
input[type=checkbox] { appearance: none; width: 18px; height: 18px; margin: 2px 0 0; border: 1.5px solid var(--muted); border-radius: 50%; display: grid; place-content: center; cursor: pointer; }
input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
input[type=checkbox]:checked::after { content: ""; width: 8px; height: 4px; border: 2px solid var(--bg); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label { min-width: 0; overflow-wrap: anywhere; cursor: pointer; }
li.done label { color: var(--muted); text-decoration: line-through; }
.x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 17px; line-height: 1; padding: 2px 4px; opacity: 0; }
li:hover .x, .x:focus-visible { opacity: .8; }
@media (hover: none) { .x { opacity: .5; } }
form { display: flex; gap: 8px; }
form input { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: none; border: 0; border-bottom: 1px solid var(--line); padding: 8px 0; }
form input::placeholder { color: var(--muted); }
form button { font: inherit; font-weight: 500; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 8px 4px; }
.note { font-size: 13px; color: var(--muted); min-height: 1em; }
</style>

<div class="wrap">
  <h1>Game of Crowns Roadmap</h1>
  <ul id="list"><li style="display:block;color:var(--muted)">Loading…</li></ul>
  <form id="add"><input id="new-text" placeholder="Add a feature" maxlength="200" autocomplete="off"><button id="new-btn">Add</button></form>
  <div class="note" id="note"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let items = [], col = null;
function render() {
  const ul = $("list"); ul.replaceChildren();
  const sorted = [...items].sort((a, b) => (a.done - b.done) || ((a.created ?? 0) - (b.created ?? 0)));
  if (!sorted.length) { const e = document.createElement("li"); e.style.display = "block"; e.style.color = "var(--muted)"; e.textContent = "Nothing yet. Add the first feature below."; ul.append(e); }
  for (const it of sorted) {
    const li = document.createElement("li"); if (it.done) li.className = "done";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.id = "cb-" + it.id; cb.checked = !!it.done;
    cb.addEventListener("change", () => write(() => col.doc(it.id).update({ done: cb.checked })));
    const t = document.createElement("label"); t.htmlFor = cb.id; t.textContent = it.text;
    const x = document.createElement("button"); x.className = "x"; x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "Remove " + it.text);
    x.addEventListener("click", () => write(() => col.doc(it.id).delete()));
    li.append(cb, t, x); ul.append(li);
  }
}
async function write(fn) {
  if (!col) { $("note").textContent = "The list can't be saved from this view."; return; }
  try { await fn(); $("note").textContent = ""; } catch (e) { $("note").textContent = "That didn't save. Try again."; }
}
$("add").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("new-text").value.trim(); if (!text) return;
  $("new-btn").disabled = true;
  await write(() => col.add({ text, done: false, created: Date.now() }));
  $("new-text").value = ""; $("new-btn").disabled = false; $("new-text").focus();
});
(async () => {
  const timer = setTimeout(() => { if (!col) $("note").textContent = "The list didn't load. Reopen the page."; }, 10000);
  const db = await claude.use("db");
  if (!db) { clearTimeout(timer); $("list").replaceChildren(); $("note").textContent = "Sign in to see the list."; return; }
  col = db.collection("items");
  col.onSnapshot((snap) => { clearTimeout(timer); items = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); },
    () => { clearTimeout(timer); $("note").textContent = "The list stopped updating. Reopen the page."; });
})();
</script>
